version: '3.9'

services:
  mongodb:
    image: mongo:7.0
    container_name: ts_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: tournament_system
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - ts_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ts_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/tournament_system?authSource=admin
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - ts_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ts_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - ts_network

volumes:
  mongo_data:

networks:
  ts_network:
    driver: bridge
